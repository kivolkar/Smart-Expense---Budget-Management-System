tags:
  - name: Insights
    description: Smart predictive text arrays

paths:
  /api/insights:
    get:
      summary: Fetch dynamic warnings, budget overrun risks, and MoM trends
      description: Predicts user behavior mathematically based on Time vs Velocity. Returns an array of human-readable alerts.
      tags: [Insights]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Actionable alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [warning, alert, success]
                    title:
                      type: string
                    message:
                      type: string
        401:
          description: Unauthorized
