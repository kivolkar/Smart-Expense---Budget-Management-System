tags:
  - name: Dashboard
    description: Master overview engine combining multiple data clusters natively

paths:
  /api/dashboard:
    get:
      summary: Fetch high-level master balances and unified time-series arrays
      description: Bypasses the need to ping transactions, budgets, and savings pipelines independently. Natively executes parallel Promise.all aggregations.
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        200:
          description: A heavily structured Object combining core platform totals and a `monthlyOverview` array perfectly sorted for Chart.js or Recharts components.
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentBalance:
                    type: number
                  totalIncome:
                    type: number
                  totalExpense:
                    type: number
                  totalSavings:
                    type: number
                  monthlyOverview:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: number
                        month:
                          type: number
                        income:
                          type: number
                        expense:
                          type: number
        401:
          description: Unauthorized
