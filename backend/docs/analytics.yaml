tags:
  - name: Analytics
    description: Deep charting insights generated natively

paths:
  /api/analytics/categories:
    get:
      summary: Fetch structured Pie Chart data grouping expenses
      description: Returns highly calculated category chunks. Perfect for Recharts Pie Graph.
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        200:
          description: A structured array of Category names and spent totals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                    icon:
                      type: string
                    color:
                      type: string
                    totalAmount:
                      type: number
        401:
          description: Unauthorized

  /api/analytics/yearly:
    get:
      summary: Fetch high-level Bar Chart data sorting income vs expense by year
      description: Merges total yearly boundaries 
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        200:
          description: A structured array mapped to each active year
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    year:
                      type: number
                    income:
                      type: number
                    expense:
                      type: number
        401:
          description: Unauthorized
