tags:
  - name: Budgets
    description: Dynamic expense limits mapped to timelines

paths:
  /api/budgets:
    get:
      summary: Fetch all user budgets including full mathematical breakdown
      tags: [Budgets]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Array of budgets, natively decorated with `spentAmount`, `remainingAmount`, `percentageUsed`, and `isExceeded` status boolean dynamically configured by the server. 
        401:
          description: Unauthorized
          
    post:
      summary: Establishes a new expense limit boundary
      tags: [Budgets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, amount, startDate, endDate]
              properties:
                category:
                  type: string
                  description: Mongo ID of a specific Expense Category
                amount:
                  type: number
                  description: The maximum allowed expenditure 
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        201:
          description: Budget correctly established
        400:
          description: Bad data or Time-travel prevention error (start after end)
        401:
          description: Unauthorized

  /api/budgets/{id}:
    get:
      summary: Get details of a single budget tracker
      tags: [Budgets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Specific budget constraint data Native (spentAmount, remainingAmount, percentageUsed, isExceeded included)
        401:
          description: Not authorized to access this constraint
        404:
          description: Budget not found

    put:
      summary: Modify an existing budget
      tags: [Budgets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                amount:
                  type: number
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        200:
          description: Constraints updated correctly.
        401:
          description: Unauthorized
        404:
          description: Record missing.

    delete:
      summary: Forgets a database budget limit
      tags: [Budgets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Budget destroyed
        401:
          description: Unauthorized
