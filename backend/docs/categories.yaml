tags:
  - name: Categories
    description: Category management

paths:
  /api/categories:
    get:
      summary: Fetch all categories for the logged in user
      tags: [Categories]
      security:
        - bearerAuth: []
      responses:
        200:
          description: A list of categories
        401:
          description: Not authorized
          
    post:
      summary: Create a new category
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [income, expense]
                icon:
                  type: string
      responses:
        201:
          description: Category created
        400:
          description: Invalid form data

  /api/categories/{id}:
    get:
      summary: Fetch a single category by ID
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: The category data
        401:
          description: Not authorized to access this category
        404:
          description: Category not found
          
    put:
      summary: Update an existing category
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [income, expense]
                icon:
                  type: string
      responses:
        200:
          description: Category updated
        401:
          description: Not authorized
          
    delete:
      summary: Delete a category
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Category removed
        401:
          description: Not authorized
