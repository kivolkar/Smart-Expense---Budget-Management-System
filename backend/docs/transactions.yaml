tags:
  - name: Transactions
    description: Financial records logging

paths:
  /api/transactions:
    get:
      summary: Fetch all transactions for the logged in user
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter transactions occurring on or after this date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter transactions occurring on or before this date
        - in: query
          name: type
          schema:
            type: string
            enum: [income, expense]
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category Mongo ID
        - in: query
          name: paymentMethod
          schema:
            type: string
            enum: ['cash', 'credit_card', 'debit_card', 'upi', 'bank_transfer']
      responses:
        200:
          description: List of transactions matching query
        400:
          description: Invalid query data
        401:
          description: Unauthorized
          
    post:
      summary: Log a new financial transaction
      tags: [Transactions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, type, category, paymentMethod]
              properties:
                amount:
                  type: number
                type:
                  type: string
                  enum: [income, expense]
                category:
                  type: string
                  description: Mongo ID of a specific Category
                paymentMethod:
                  type: string
                  enum: ['cash', 'credit_card', 'debit_card', 'upi', 'bank_transfer']
                description:
                  type: string
                date:
                  type: string
                  format: date-time
      responses:
        201:
          description: Transaction successfully created
        400:
          description: Validations failure
        401:
          description: Unauthorized

  /api/transactions/{id}:
    get:
      summary: Get details of a single transaction
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: The transaction payload
        401:
          description: Not authorized to access this transaction
        404:
          description: Transaction not found

    put:
      summary: Modify an existing transaction
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                type:
                  type: string
                  enum: [income, expense]
                paymentMethod:
                  type: string
                  enum: ['cash', 'credit_card', 'debit_card', 'upi', 'bank_transfer']
                category:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date-time
      responses:
        200:
          description: Transaction updated
        401:
          description: Unauthorized
        404:
          description: Transaction not found

    delete:
      summary: Delete a transaction
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Transaction completely removed
        401:
          description: Unauthorized
